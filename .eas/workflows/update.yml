# Every push to main sends an over-the-air update to installed test builds
# (the "preview" channel). Changes that need a new native build are skipped
# automatically by runtimeVersion "fingerprint" in app.config.ts.
#
# One job per phone platform: platform "all" also exports a WEB bundle, which
# this app doesn't have (no react-native-web) — that failed the first run.
# Android only for now: there is no iPhone build yet, and on Expo's free tier
# every job waits in one queue — the unused iPhone job doubled the wait and
# held up a real build on 2026-09-28. Add an update_ios job back (same shape,
# platform: ios) with the first iPhone build.
# (Kept out of app.config.ts on purpose: changing the app config changes the
# build fingerprint, and updates would then skip already-installed builds.)
name: Update preview builds

on:
  push:
    branches: ['main']

jobs:
  update_android:
    name: Publish update (Android)
    type: update
    environment: preview
    params:
      channel: preview
      platform: android
