# Store builds (production profile) for Google Play and the App Store.
# Runs on Expo's servers with the Foundation's EAS credentials whenever the
# `release` branch is pushed, or by hand: `npx eas-cli@latest workflow:run store-builds.yml`.
# The iOS job signs with the distribution certificate and provisioning profile
# stored in EAS credentials (created 2026-10-15, valid to 2027-10-15). Past
# that date, run `npx eas-cli@latest credentials --platform ios` once to renew.
name: Store builds

on:
  push:
    branches: ['release']
  workflow_dispatch: {}

jobs:
  build_android:
    name: Build Android (Play Store)
    type: build
    params:
      platform: android
      profile: production
  build_ios:
    name: Build iOS (App Store)
    type: build
    params:
      platform: ios
      profile: production
